<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="theme-color" content="#00AAB0"><link rel="canonical" href="https://plugin.homacrm.com/">
<title>دریافت افزونهٔ HomaCRM | لینک نصب به ایمیل</title><meta name="description" content="ایمیلتان را بنویسید تا لینک دانلود و نصب افزونهٔ پیامک و CRM وردپرس هما را برایتان بفرستیم.">
<style>
:root{color-scheme:light dark;--ink:#14181f;--mut:#5b6472;--line:#dfe6ec;--teal:#00AAB0;--teal2:#008b90;--bg1:#eef9fa;--bg2:#fbfcfd;--card:#fff;--inp:#fff}
@media(prefers-color-scheme:dark){:root{--ink:#eef1f5;--mut:#a3adbb;--line:#2a323d;--bg1:#0f1a1c;--bg2:#0e1116;--card:#171b22;--teal2:#35c9cf;--inp:#0e1116}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:clamp(10px,2.4dvh,20px) 16px;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2) 60%);font:16px/1.9 system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",Arial,sans-serif}
.c{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3.4dvh,28px) 22px clamp(14px,2.6dvh,24px);text-align:center;box-shadow:0 12px 40px rgba(0,60,70,.10);position:relative;overflow:hidden}
.c:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,#BCD630,#F3C015,#E33426,#00AAB0)}
.m{display:block;margin:2px auto clamp(4px,1.2dvh,10px);width:clamp(44px,7dvh,60px);height:auto;aspect-ratio:1;border-radius:22%}
h1{font-size:clamp(18px,3dvh,22px);line-height:1.45;margin:0 0 4px}
p{margin:clamp(3px,.8dvh,6px) 0;color:var(--mut);font-size:clamp(13px,1.9dvh,14.5px)}
label{display:block;text-align:right;font-weight:700;font-size:14px;margin:clamp(10px,2dvh,18px) 0 6px}
input[type=email]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;font:600 16px Arial,Helvetica,sans-serif;background:var(--inp);color:var(--ink);text-align:left;direction:ltr}
input[type=email]:focus{outline:3px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
button{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin:clamp(10px,2dvh,16px) 0 6px;background:var(--teal);color:#fff;border:0;border-radius:16px;padding:13px 18px;font:800 18px system-ui,Tahoma,Arial,sans-serif;cursor:pointer;box-shadow:0 8px 20px rgba(0,170,176,.30)}
button:hover,button:focus-visible{background:var(--teal2);outline:3px solid var(--ink);outline-offset:2px}button:disabled{opacity:.6;cursor:wait}
.msg{min-height:24px;margin:6px 0 0;font-weight:700;font-size:14px}.ok{color:#0b8a5a}.bad{color:#c53030}
.n{margin-top:clamp(6px,1.6dvh,12px);font-size:12.5px;color:var(--mut)}a{color:var(--teal2)}
.done{display:none}.sent .form{display:none}.sent .done{display:block}
.big{font-size:44px;line-height:1.2}
</style></head><body><main class="c" id="box">
<img class="m" src="/icon.svg" width="56" height="56" alt="">
<div class="form"><h1>پلاگین رو برات ارسال کنیم؟</h1>
<form id="f" novalidate><label for="e">ایمیل شما</label>
<input id="e" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
<input class="hp" type="text" id="w" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<button type="submit" id="b"><span>ارسال افزونه به ایمیل من</span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4L9 15"/><path d="M20 4l-7 16-4-5-5-4z"/></svg></button>
<div class="msg" id="m" role="status" aria-live="polite"></div></form>
</div>
<div class="done"><div class="big" aria-hidden="true">✉️</div><h1>لینک نصب به ایمیلتان رفت</h1><p id="dm"></p><p>اگر تا چند دقیقه نرسید، پوشهٔ اسپم یا «Promotions» را هم نگاه کنید.</p><p class="n">پرسش؟ <a href="mailto:support@homacrm.com">support@homacrm.com</a> · <a href="/">بازگشت به صفحهٔ افزونه</a></p></div>
</main>
<script>
(function(){var t0=Date.now(),q=new URLSearchParams(location.search),f=document.getElementById('f'),m=document.getElementById('m'),b=document.getElementById('b'),box=document.getElementById('box');
function beacon(e,x){try{var d=JSON.stringify(Object.assign({e:e,p:location.pathname,q:location.search.slice(0,200),r:(document.referrer||'').slice(0,300),l:navigator.language,tz:(Intl.DateTimeFormat().resolvedOptions().timeZone||''),w:innerWidth,h:innerHeight,ua:navigator.userAgent.slice(0,300)},x||{}));if(navigator.sendBeacon)navigator.sendBeacon('/t',d)}catch(_){}}
beacon('view');
f.addEventListener('submit',function(ev){ev.preventDefault();var em=document.getElementById('e').value.trim();m.className='msg';
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(em)){m.textContent='ایمیل معتبر نیست.';m.className='msg bad';return}
 b.disabled=true;m.textContent='در حال ارسال…';beacon('click',{id:'send_link'});
 fetch('/api/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,website:document.getElementById('w').value,dt:Date.now()-t0,us:q.get('utm_source')||'',um:q.get('utm_medium')||'',uc:q.get('utm_campaign')||'',ut:q.get('utm_content')||'',ref:document.referrer||'',lang:navigator.language||''})})
 .then(function(r){return r.json().then(function(j){return[r.status,j]})}).then(function(a){var st=a[0],j=a[1];
  if(j.ok){document.getElementById('dm').textContent='ارسال شد به: '+em;box.className='c sent';beacon('submit_ok')}
  else if(st==429){m.textContent='درخواست‌ها زیاد است؛ کمی بعد دوباره امتحان کنید.';m.className='msg bad';b.disabled=false}
  else{m.textContent='ایمیل معتبر نیست یا ارسال ممکن نشد.';m.className='msg bad';b.disabled=false}})
 .catch(function(){m.textContent='ارتباط برقرار نشد؛ دوباره امتحان کنید.';m.className='msg bad';b.disabled=false})})
})();
</script></body></html>
